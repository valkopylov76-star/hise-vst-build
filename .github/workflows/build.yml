name: Build HISE 32-bit VST

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Распаковываем файлы в структуру C:\MyFirstVST
    - name: Unpack project sources
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "C:\MyFirstVST"
        Expand-Archive -Path "MyFirstVST.zip" -DestinationPath "C:\MyFirstVST" -Force

    # Разворачиваем 32-битный компилятор
    - name: Set up MinGW 32-bit (i686)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        install: >-
          mingw-w64-i686-gcc
          mingw-w64-i686-make
        update: true
        suppress-deprecation-warnings: msystem-mingw32

    # Заходим в Binaries и запускаем компиляцию
    - name: Compile VST Plugin
      shell: cmd
      run: |
        set PATH=C:\msys64\mingw32\bin;C:\msys64\usr\bin;%PATH%
        set CC=gcc
        set CXX=g++
        
        :: Переходим напрямую в папку с вашим батником
        cd /d C:\MyFirstVST\Binaries
        
        echo === ЗАПУСК СБОРКИ В ПАПКЕ BINARIES ===
        @echo on
        :: Скрипт автоматически найдет любой батник в этой папке и выполнит его
        for %%i in (*.bat *.cmd) do (
            call "%%i"
            goto :exit_loop
        )
        :exit_loop
        @echo off
        echo Скрипт батника завершил работу.

    # Сохраняем результат
    - name: Upload VST2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hise-VST2-32bit
        :: Ищем созданную DLL по всему проекту, включая папки внутри Binaries
        path: C:\MyFirstVST\**\*Hise*.dll
        if-no-files-found: error
